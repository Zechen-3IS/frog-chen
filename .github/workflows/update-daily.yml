name: Update daily (rest)

on:
  schedule:
    # 23:00 Asia/Shanghai
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: frog-daily-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily pages
        working-directory: src
        run: python main.py --daily

      - name: Publish HTML
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY || github.repository }}
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH || 'pages' }}
        run: |
          chmod +x .github/scripts/push-pages.sh
          .github/scripts/push-pages.sh daily "自动更新每日页面"
