name: Update live (pick pages)

on:
  schedule:
    # Every 15 minutes UTC (GitHub may delay under load)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: frog-live-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Connectivity check
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://www.live-tennis.cn/zh/survivor/calendar/2026"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  print("live-tennis status", r.status, "len", len(r.read(200)))
          except Exception as e:
              print("live-tennis UNREACHABLE:", type(e).__name__, e)
          PY

      - name: Generate pick-related pages
        working-directory: src
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
        run: python -u main.py --live

      - name: Publish HTML
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY || github.repository }}
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH || 'pages' }}
        run: |
          chmod +x .github/scripts/push-pages.sh
          .github/scripts/push-pages.sh live "自动更新选人相关页面"
