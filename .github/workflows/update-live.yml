name: Update live (pick pages)

on:
  workflow_dispatch:
    # Cadence comes from tick-live.yml (a job sleeps 15 min, then dispatches
    # this workflow and the next tick). GitHub's own */15 cron is not used.

concurrency:
  group: frog-live-pages
  # Prefer the newest dispatch; overlapping 15‑min pings cancel stale runs.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore event caches
        uses: actions/cache@v4
        with:
          path: |
            data/event_scores
            data/event_draws
            data/event_day_rounds
          key: event-cache-${{ github.run_id }}
          restore-keys: |
            event-cache-

      - name: Restore caches from pages branch
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY || github.repository }}
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH || 'pages' }}
        run: |
          chmod +x .github/scripts/restore-event-cache.sh
          .github/scripts/restore-event-cache.sh

      - name: Connectivity check
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://www.live-tennis.cn/zh/survivor/calendar/2026"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  print("live-tennis status", r.status, "len", len(r.read(200)))
          except Exception as e:
              print("live-tennis UNREACHABLE:", type(e).__name__, e)
          PY

      - name: Generate pick-related pages
        working-directory: src
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
        run: python -u main.py --live

      - name: Publish HTML
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY || github.repository }}
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH || 'pages' }}
        run: |
          chmod +x .github/scripts/push-pages.sh
          .github/scripts/push-pages.sh live "自动更新选人相关页面"
